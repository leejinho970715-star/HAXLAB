name: Build and deploy HEXLAB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        working-directory: hexlab
        run: |
          node --check src/app.js
          node --check src/core.js
          node --check src/worker.mjs
      - name: Verify security and simulation behavior
        working-directory: hexlab
        run: npm test
      - name: Build
        working-directory: hexlab
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hexlab/dist/client
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
